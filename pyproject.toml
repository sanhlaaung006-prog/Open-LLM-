[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openllm-tools"
version = "0.1.0"
description = "Dependency-free web tools for LLM agents: page fetching and Brave Search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open-LLM contributors" }]
keywords = ["llm", "agents", "tools", "web-fetch", "brave-search", "function-calling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
openllm-web = "openllm_tools.web.cli:main"

[project.urls]
Homepage = "https://github.com/sanhlaaung006-prog/Open-LLM-"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
