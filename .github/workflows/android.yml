name: android-apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # AGP is allowed to fetch any missing SDK component; the runner image
      # already ships the SDK and an accepted license set.
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME" || true
          echo "--- platforms:"; ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools:"; ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK missing"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build errors as a commit comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          path = "android/build.log"
          log = open(path, errors="replace").read() if os.path.exists(path) else ""
          lines = log.splitlines()
          pattern = re.compile(r"^(e: |FAILURE|What went wrong|Caused by|> Task .*FAILED)|error:|Could not (resolve|find|download)")
          picked = [l for l in lines if pattern.search(l)][-90:]
          tail = lines[-60:]
          detail = "\n".join(picked[:90]) if picked else "(no filtered lines)"
          body = (
              "### Gradle build failed\n\n"
              "**Filtered**\n```\n" + detail + "\n```\n\n"
              "**Tail**\n```\n" + "\n".join(tail) + "\n```\n"
          )

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps({"body": body[:65000]}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "openllm-ci",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(req, timeout=30)
              print("comment posted")
          except Exception as exc:  # noqa: BLE001
              print("could not post comment:", exc)
          PY

      - name: Report APK
        working-directory: android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenLLM-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
